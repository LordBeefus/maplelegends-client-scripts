name: Auto PR On Push

on:
  push:
    branches:
      - "**"

permissions:
  contents: read
  pull-requests: write

jobs:
  create-pr:
    if: github.ref_type == 'branch' && github.ref_name != 'main'
    runs-on: ubuntu-latest

    steps:
      - name: Create PR if one is not open
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = context.ref.replace('refs/heads/', '');
            const base = 'main';
            const head = `${owner}:${branch}`;

            core.info(`Checking for existing PR from ${head} to ${base}`);

            const existing = await github.rest.pulls.list({
              owner,
              repo,
              state: 'open',
              head,
              base,
              per_page: 1
            });

            if (existing.data.length > 0) {
              core.info(`PR already exists: #${existing.data[0].number}`);
              return;
            }

            const commitMsg = context.payload.head_commit?.message || 'Automated PR creation';
            const title = `Auto PR: ${branch} -> ${base}`;
            const body = [
              'This pull request was created automatically after a push.',
              '',
              `- Branch: ${branch}`,
              `- Base: ${base}`,
              `- Actor: @${context.actor}`,
              `- Commit: ${context.sha}`,
              '',
              'Latest commit message:',
              '```',
              commitMsg,
              '```'
            ].join('\n');

            const pr = await github.rest.pulls.create({
              owner,
              repo,
              title,
              head: branch,
              base,
              body,
              maintainer_can_modify: true
            });

            core.info(`Created PR #${pr.data.number}: ${pr.data.html_url}`);
