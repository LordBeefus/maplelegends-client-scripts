name: Release Zip

on:
  release:
    types: [published]
  pull_request:
    types: [closed]
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-attach-zip:
    if: github.event_name != 'pull_request' || (github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build zip from repository snapshot
        run: |
          BUILD_DATE="$(date -u '+%Y%m%d')"

          ARCHIVE_BASENAME="ML-Unofficial-SteamDeck-${BUILD_DATE}"
          ARCHIVE_NAME="${ARCHIVE_BASENAME}.zip"
          ARCHIVE_ROOT="${ARCHIVE_BASENAME}/"

          # git archive packages the tracked repository snapshot.
          # Ignored/untracked files are excluded by design.
          # --prefix puts all files under a single top-level folder in the zip.
          git archive --format=zip --prefix "$ARCHIVE_ROOT" --output "$ARCHIVE_NAME" HEAD

          echo "ARCHIVE_NAME=$ARCHIVE_NAME" >> "$GITHUB_ENV"

      - name: Upload zip to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ARCHIVE_NAME }}

      - name: Extract archive for artifact upload
        if: github.event_name != 'release'
        run: unzip "${{ env.ARCHIVE_NAME }}" -d artifact_staging

      - name: Upload zip as workflow artifact
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVE_NAME }}
          path: artifact_staging/
